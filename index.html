<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakuraku Dinokun</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" type="text/css" href="slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="slick/slick-theme.css"/>
    <link rel="stylesheet" href="./css/style.css">
   
</head>
<body>
    <div class="instrucoes">
        <img src="./img/instrucoes/banner1.png" alt="Instrucoes">
        <img src="./img/instrucoes/banner2.png" alt="Instrucoes">
        <img src="./img/instrucoes/banner3.png" alt="Instrucoes">
    </div>

    <div class="principal">
        <div class="corpo-tamagotchi">
            <img class="corpo-tamagotchi-img" src="./img/tamagotchiImg/all.png" alt="">
            <img class="botoes-select botoes" id="botao-select-esquerdo" src="./img/tamagotchiImg/buttonLeft.png" alt="Botão esquedo select.">
            <img class="botoes-select botoes" id="botao-select-direito" src="./img//tamagotchiImg/buttonRigth.png" alt="Botão direito select.">
            <img class="botao-esc botoes" id="esc" src="./img/tamagotchiImg/buttonEsc.png" alt="Botao esc.">
            <img class="botao-enter botoes" id="enter" src="./img/tamagotchiImg/buttonEnter.png" alt="Botão enter.">
            <img class="botao-clock botoes" id="clock" src="./img/tamagotchiImg/buttonClock.png" alt="Botão clock.">
            <img id="img-chavinha" src="./img/chave.png" alt="Chavinha"><div id="iniciar-jogo" class="chavinha"></div>
        
                <div class="display">

                    <div class="colunas-das-atividades">
                        <div class="opcao-esquerda"><img class="atividade-esquerda" id="agua" src="./img/agua.png" alt=""></div>
                        <div class="opcao-esquerda"><img class="atividade-esquerda" id="comida" src="./img/comida.png" alt=""></div>
                        <div class="opcao-esquerda"><img class="atividade-esquerda" id="luz" src="./img/luz.png" alt=""></div>
                        <div class="opcao-esquerda"><img class="atividade-esquerda" id="carinho" src="./img/carinho.png" alt=""></div>
                        <div class="opcao-esquerda"><img class="atividade-esquerda" id="necessidades" src="./img/tarefas.png" alt=""></div>
                        
                    </div>


                    <main class="main">
                    
                    </main>


                    <div class="colunas-das-atividades">
                        <div class="opcao-direita"><img class="atividade-direita" id="brincadeira" src="./img/brincar.png" alt=""></div>
                        <div class="opcao-direita"><img class="atividade-direita" id="estudo" src="./img/estudar.png" alt=""></div>
                        <div class="opcao-direita"><img class="atividade-direita" id="banho" src="./img/banho.png" alt=""></div>
                        <div class="opcao-direita"><img class="atividade-direita" id="ar" src="./img/ar.png" alt=""></div>
                        <div class="opcao-direita"><img class="atividade-direita" id="medico" src="./img/medico.png" alt=""> </div>     
                            
                    </div>

                </div>
            
        </div>
    </div>
        

    
    <!-- Painel de Debug (clique no título "Rakuraku Dinokun" para abrir) -->
    <div id="debug-panel" style="display:none; position:fixed; top:10px; right:10px; background:#1a1a2e; color:#eee; padding:15px; border-radius:8px; z-index:9999; font-family:sans-serif; font-size:12px; width:220px; border:1px solid #334155; max-height:90vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong style="color:#7dd3fc;">Debug Stats</strong>
        <span id="debug-close" style="cursor:pointer; color:#ef4444;">✕</span>
      </div>
      <div id="debug-fields"></div>
      <div style="margin-top:10px; border-top:1px solid #334155; padding-top:8px;">
        <strong style="color:#7dd3fc; font-size:11px;">Ambiente</strong>
        <div style="display:flex; justify-content:space-between; align-items:center; margin:3px 0;">
          <label style="color:#94a3b8; font-size:11px;">Luz</label>
          <input id="dbg-luz" type="checkbox" style="width:auto;">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin:3px 0;">
          <label style="color:#94a3b8; font-size:11px;">Ar Condicionado</label>
          <input id="dbg-ac" type="checkbox" style="width:auto;">
        </div>
      </div>
      <div style="margin-top:10px; border-top:1px solid #334155; padding-top:8px;">
        <strong style="color:#7dd3fc; font-size:11px;">Relógio Interno</strong>
        <div style="display:flex; gap:5px; align-items:center; margin:5px 0;">
          <input id="dbg-hora" type="number" min="0" max="23" style="width:45px; padding:3px 5px; background:#0f172a; color:#eee; border:1px solid #334155; border-radius:3px; font-size:13px; text-align:center;">
          <span style="color:#64748b;">:</span>
          <input id="dbg-minuto" type="number" min="0" max="59" style="width:45px; padding:3px 5px; background:#0f172a; color:#eee; border:1px solid #334155; border-radius:3px; font-size:13px; text-align:center;">
          <button id="debug-set-clock" style="padding:3px 8px; background:#0284c7; color:#fff; border:none; border-radius:3px; cursor:pointer; font-size:10px;">Definir</button>
        </div>
        <div id="debug-clock-display" style="font-size:10px; color:#94a3b8;"></div>
      </div>
      <button id="debug-apply" style="width:100%; margin-top:8px; padding:6px; background:#0284c7; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:11px;">Aplicar Stats</button>
      <button id="debug-reset" style="width:100%; margin-top:4px; padding:6px; background:#7f1d1d; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:11px;">Reset (novo jogo)</button>
      <button id="debug-forcar-tick" style="width:100%; margin-top:4px; padding:6px; background:#059669; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:11px;">Forçar Tick (1 hora)</button>
      <button id="debug-test-degradacao" style="width:100%; margin-top:4px; padding:6px; background:#6d28d9; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:11px;">Testar Degradação 24h</button>
      <div id="debug-log" style="margin-top:8px; font-size:10px; color:#94a3b8; white-space:pre-wrap; max-height:200px; overflow-y:auto;"></div>
    </div>

    <script type="module">
      import { obterStats, alterarStat, salvarStats, resetarStats, carregarStats, degradarStats } from "./js/principal/stats.js";
      import { carregarEstado, limparEstado, salvarEstado } from "./js/principal/saveSystem.js";
      import { definirHora, getHoras, getMinutos } from "./js/principal/relogioInterno.js";

      const editableStats = [
        { key: "fome", label: "Fome", min: 0, max: 4, type: "number" },
        { key: "sede", label: "Sede", min: 0, max: 4, type: "number" },
        { key: "humor", label: "Humor", min: 0, max: 5, type: "number" },
        { key: "peso", label: "Peso (kg)", min: 1, max: 100, type: "number" },
        { key: "idade", label: "Idade (dias)", min: 0, max: 30, type: "number" },
        { key: "educacao", label: "Educação", min: 0, max: 4, type: "number" },
        { key: "temperatura", label: "Temperatura", min: 10, max: 40, type: "number" },
        { key: "doente", label: "Doente", type: "checkbox" },
        { key: "comCalor", label: "Com Calor (>30°C)", type: "checkbox" },
        { key: "comFrio", label: "Com Frio (<20°C)", type: "checkbox" },
        { key: "sujo", label: "Sujo", type: "checkbox" },
        { key: "dormindo", label: "Dormindo", type: "checkbox" },
        { key: "vivo", label: "Vivo", type: "checkbox" },
        { key: "horasDoente", label: "Horas doente", min: 0, max: 24, type: "number" },
        { key: "comidaPendente", label: "Comida pendente", min: 0, max: 20, type: "number" },
      ];

      function refreshAmbiente() {
        const estado = carregarEstado() || {};
        document.getElementById("dbg-luz").checked = estado.estadoLuz === true;
        document.getElementById("dbg-ac").checked = estado.estadoAC === "ligar";
      }

      function buildDebugFields() {
        const container = document.getElementById("debug-fields");
        container.innerHTML = "";
        const stats = obterStats();
        refreshAmbiente();

        editableStats.forEach(s => {
          const row = document.createElement("div");
          row.style.cssText = "display:flex; justify-content:space-between; align-items:center; margin:3px 0;";

          const lbl = document.createElement("label");
          lbl.textContent = s.label;
          lbl.style.cssText = "color:#94a3b8; font-size:11px;";

          const input = document.createElement("input");
          input.id = "dbg-" + s.key;
          input.style.cssText = "width:60px; padding:3px 5px; background:#0f172a; color:#eee; border:1px solid #334155; border-radius:3px; font-size:11px; text-align:right;";

          if (s.type === "checkbox") {
            input.type = "checkbox";
            input.checked = !!stats[s.key];
            input.style.width = "auto";
          } else {
            input.type = "number";
            input.min = s.min;
            input.max = s.max;
            input.value = stats[s.key] ?? 0;
          }

          row.appendChild(lbl);
          row.appendChild(input);
          container.appendChild(row);
        });
      }

      function refreshFields() {
        const stats = obterStats();
        editableStats.forEach(s => {
          const input = document.getElementById("dbg-" + s.key);
          if (!input) return;
          if (s.type === "checkbox") input.checked = !!stats[s.key];
          else input.value = stats[s.key] ?? 0;
        });
        refreshAmbiente();
      }

      document.getElementById("debug-apply").addEventListener("click", () => {
        editableStats.forEach(s => {
          const input = document.getElementById("dbg-" + s.key);
          if (!input) return;
          const val = s.type === "checkbox" ? input.checked : Number(input.value);
          alterarStat(s.key, val);
        });
        salvarStats();
        salvarEstado({
          estadoLuz: document.getElementById("dbg-luz").checked,
          estadoAC: document.getElementById("dbg-ac").checked ? "ligar" : "desligar"
        });
        document.getElementById("debug-log").textContent = "✓ Stats aplicados! (" + new Date().toLocaleTimeString() + ")";
      });

      document.getElementById("debug-reset").addEventListener("click", () => {
        if (!confirm("Resetar tudo e começar novo jogo?")) return;
        limparEstado();
        location.reload();
      });

      document.getElementById("debug-close").addEventListener("click", () => {
        document.getElementById("debug-panel").style.display = "none";
      });

      document.getElementById("debug-forcar-tick").addEventListener("click", () => {
        const estado = carregarEstado() || {};
        const estadoLuz = estado.estadoLuz === true;
        const estadoAC = estado.estadoAC || "desligar";
        const hora = getHoras();
        const antes = JSON.parse(JSON.stringify(obterStats()));
        degradarStats(estadoLuz, estadoAC, hora);
        salvarStats();
        // Avança o relógio 1 hora
        const novaHora = (hora + 1) % 24;
        definirHora(novaHora, getMinutos());
        refreshFields();
        const depois = obterStats();
        let mudancas = [];
        if (antes.comidaPendente !== depois.comidaPendente) mudancas.push("comida " + antes.comidaPendente + "→" + depois.comidaPendente);
        if (antes.peso !== depois.peso) mudancas.push("peso " + antes.peso + "→" + depois.peso);
        if (antes.fome !== depois.fome) mudancas.push("fome " + antes.fome + "→" + depois.fome);
        if (antes.sede !== depois.sede) mudancas.push("sede " + antes.sede + "→" + depois.sede);
        if (antes.humor !== depois.humor) mudancas.push("humor " + antes.humor + "→" + depois.humor);
        if (antes.temperatura !== depois.temperatura) mudancas.push("temp " + antes.temperatura + "→" + depois.temperatura);
        const log = document.getElementById("debug-log");
        log.textContent = "Tick às " + hora + "h → " + novaHora + "h: " + (mudancas.length ? mudancas.join(", ") : "sem mudanças");
      });

      document.getElementById("debug-test-degradacao").addEventListener("click", () => {
        // Salva stats atuais para restaurar depois
        const statsBackup = JSON.parse(JSON.stringify(obterStats()));
        const log = document.getElementById("debug-log");
        let resultado = "=== Teste Degradação 24h ===\n";
        resultado += "Hora | Fome | Sede | Humor\n";
        resultado += "-----+------+------+------\n";

        // Reseta stats para valores máximos
        alterarStat("fome", 4);
        alterarStat("sede", 4);
        alterarStat("humor", 5);
        alterarStat("dormindo", false);
        alterarStat("doente", false);
        alterarStat("temperatura", 25);

        for (let h = 0; h < 24; h++) {
          const antes = { fome: obterStats().fome, sede: obterStats().sede, humor: obterStats().humor };
          degradarStats(true, "ligar", h);
          const depois = obterStats();
          const fD = antes.fome !== depois.fome ? " -" + (antes.fome - depois.fome) : "   ";
          const sD = antes.sede !== depois.sede ? " -" + (antes.sede - depois.sede) : "   ";
          const hD = antes.humor !== depois.humor ? " -" + (antes.humor - depois.humor) : "   ";
          resultado += String(h).padStart(4, " ") + " |" + fD.padStart(5, " ") + " |" + sD.padStart(5, " ") + " |" + hD.padStart(5, " ") + "\n";
        }

        resultado += "\nEsperado:\nFome/Sede: 10,11,12,13,14,15,16\nHumor: 10,12,14,16";

        // Restaura stats originais
        Object.keys(statsBackup).forEach(k => alterarStat(k, statsBackup[k]));
        salvarStats();

        log.textContent = resultado;
      });

      document.getElementById("debug-set-clock").addEventListener("click", () => {
        const h = parseInt(document.getElementById("dbg-hora").value) || 0;
        const m = parseInt(document.getElementById("dbg-minuto").value) || 0;
        definirHora(h, m);
        document.getElementById("debug-log").textContent = "✓ Relógio definido para " + h + ":" + String(m).padStart(2, "0") + " (" + new Date().toLocaleTimeString() + ")";
      });

      // Toggle do painel: clique no título
      document.querySelector(".corpo-tamagotchi-img")?.addEventListener("dblclick", () => {
        const panel = document.getElementById("debug-panel");
        if (panel.style.display === "none") {
          buildDebugFields();
          panel.style.display = "block";
        } else {
          panel.style.display = "none";
        }
      });

      // Atualiza campos a cada 2s se o painel está aberto
      setInterval(() => {
        if (document.getElementById("debug-panel").style.display !== "none") {
          refreshFields();
          // Mostra hora interna atual
          const h = getHoras();
          const m = getMinutos();
          document.getElementById("debug-clock-display").textContent =
            "Hora interna: " + String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
          document.getElementById("dbg-hora").placeholder = h;
          document.getElementById("dbg-minuto").placeholder = m;
        }
      }, 2000);
    </script>

    <script type="module" src="./js/principal/jquery.js"></script>
    <script type="module" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
    <script type="module" src="//code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
    <script type="module" src="slick/slick.min.js"></script>
    <script type="module" src="./js/slider/slider.js"></script>
    <script type="module" src="./js/principal/main.js"></script>
    <script type="module" src="./js/principal/botoes.js"></script>
  
</body>
</html>
